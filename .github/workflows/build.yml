name: Build BourseYaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o BourseYaar_Test_Project.zip -d project

          echo "=== Project files ==="
          find project -maxdepth 8 -type f | sort

      - name: Build APK
        working-directory: project/BourseYaar_Test_Project
        run: |
          gradle assembleDebug
          echo "=== Build completed ==="

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find project -type f -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BourseYaar-APK
          path: project/**/*.apk
          if-no-files-found: error
