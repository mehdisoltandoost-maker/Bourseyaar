name: Build BourseYaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o BourseYaar_Test_Project.zip -d project

          echo "=== Project files ==="
          find project -maxdepth 6 -type f | sort

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew پیدا نشد."
            echo "فایل‌های موجود پروژه:"
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BourseYaar-APK
          path: project/**/*.apk
